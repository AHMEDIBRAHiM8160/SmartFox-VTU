<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<title>Buy Airtime — Smart Fox VTU</title>
<link rel="icon" type="image/png" href="assets/smart-fox-brand.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="app-shell" id="sfvtu-shell"></div>

<template id="airtime-content">
  <div class="form-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <span style="font-size:0.85rem;color:var(--text-muted);">Wallet Balance</span>
      <strong id="airtime-balance">₦0.00</strong>
    </div>
    <form id="airtime-form">
      <div class="field">
        <label>Network</label>
        <div class="network-grid" id="network-grid"></div>
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input type="tel" id="airtime-phone" placeholder="Enter phone number (e.g. 08012345678)" />
      </div>
      <div class="field">
        <label>Amount</label>
        <div class="amount-chips" id="airtime-amount-chips">
          <div class="chip" data-amount="100">₦100</div>
          <div class="chip" data-amount="200">₦200</div>
          <div class="chip" data-amount="500">₦500</div>
          <div class="chip" data-amount="1000">₦1,000</div>
        </div>
        <input type="number" id="airtime-amount" placeholder="Or enter custom amount" min="50" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Buy Airtime</button>
    </form>
  </div>
</template>

<script src="js/common.js"></script>
<script src="js/airtime.js"></script>
<script>
  requireAuth();
  renderAppShell('airtime', 'Buy Airtime', 'Top up airtime instantly for any network.');
  document.getElementById('sfvtu-page-content').innerHTML = document.getElementById('airtime-content').innerHTML;
  initAirtimePage();
</script>
</body>
</html>
