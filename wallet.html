<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<title>Wallet — Smart Fox VTU</title>
<link rel="icon" type="image/png" href="assets/smart-fox-brand.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="app-shell" id="sfvtu-shell"></div>

<template id="wallet-content">
  <div class="wallet-summary">
    <div class="wallet-summary-top">
      <div>
        <div class="lbl"><i class="fa-solid fa-wallet"></i> Current Balance</div>
        <div class="amt" id="wallet-balance-amt">₦0.00</div>
        <div class="wallet-summary-id" id="wallet-id"></div>
      </div>
      <button class="icon-btn" id="wallet-balance-toggle" title="Hide balance"><i class="fa-solid fa-eye"></i></button>
    </div>
  </div>

  <div class="panel bank-funding-card" style="margin-bottom:14px;">
    <div class="panel-head">
      <h3><i class="fa-solid fa-building-columns"></i> Your Bank Transfer Account</h3>
      <span class="badge badge-pending" id="dva-status-badge">Not requested</span>
    </div>
    <p style="font-size:.78rem;color:var(--muted);margin:10px 0;">
      Request a dedicated account for your wallet. Once Paystack confirms it,
      you can transfer money to that account and eligible payments will be credited automatically.
    </p>

    <div id="dva-account-details" hidden>
      <div style="padding:12px;background:var(--blue-soft);border-radius:10px;margin:12px 0;">
        <div style="font-size:.72rem;color:var(--muted);">Bank</div>
        <strong id="dva-bank-name">—</strong>
        <div style="font-size:.72rem;color:var(--muted);margin-top:10px;">Account name</div>
        <strong id="dva-account-name">—</strong>
        <div style="font-size:.72rem;color:var(--muted);margin-top:10px;">Account number</div>
        <strong id="dva-account-number" style="font-size:1.15rem;letter-spacing:1px;">—</strong>
        <div style="font-size:.72rem;color:var(--muted);margin-top:8px;">Currency: NGN</div>
        <button type="button" id="dva-copy-account" class="btn btn-primary" style="margin-top:12px;">
          Copy account number
        </button>
      </div>
    </div>

    <p id="dva-status-message" role="status" aria-live="polite"
       style="font-size:.78rem;margin:10px 0;">Checking your account status...</p>

    <div id="dva-request-controls">
      <label style="display:flex;align-items:flex-start;gap:8px;font-size:.76rem;margin:12px 0;">
        <input type="checkbox" id="dva-consent" style="margin-top:3px;">
        <span>I agree to request a dedicated bank account using my registered profile details for receiving wallet deposits.</span>
      </label>
      <button type="button" id="dva-request-button" class="btn btn-primary btn-block" disabled>
        Request Dedicated Account
      </button>
    </div>
  </div>

  <div class="form-panel" style="margin-bottom:28px;">
    <h3 style="margin-bottom:16px;">Fund Wallet</h3>
    <form id="fund-wallet-form">
      <div class="amount-chips">
        <div class="chip" data-amount="1000">₦1,000</div>
        <div class="chip" data-amount="2000">₦2,000</div>
        <div class="chip" data-amount="5000">₦5,000</div>
        <div class="chip" data-amount="10000">₦10,000</div>
      </div>
      <div class="field">
        <label>Amount</label>
        <input type="number" id="fund-amount-input" placeholder="Enter amount" min="100" />
      </div>
      <div class="field">
        <label>Payment Method</label>
        <select id="fund-method">
          <option value="">Select payment method</option>
          <option>Debit Card</option>
          <option>Bank Transfer</option>
          <option>USSD</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Continue</button>
    </form>
  </div>

  <div class="panel-head"><h3>Wallet Transactions</h3></div>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Reference</th><th>Description</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
      <tbody id="wallet-history-body"></tbody>
    </table>
  </div>
</template>

<script src="js/common.js"></script>
<script src="js/wallet.js"></script>
<script>
  requireAuth();
  renderAppShell('wallet', 'Wallet', 'Fund your wallet and track wallet activity.');
  document.getElementById('sfvtu-page-content').innerHTML = document.getElementById('wallet-content').innerHTML;
  initWalletPage();
</script>
</body>
</html>
